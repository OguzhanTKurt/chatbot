version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot_db
    environment:
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
      POSTGRES_DB: chatbot_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: chatbot_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://chatbot_user:chatbot_password@db:5432/chatbot_db
      # Opsiyonel: Ollama eğer local'de ise host'un adresini bilmesi gerekir (ör: host.docker.internal)
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

    volumes:
      - .:/app
    depends_on:
      - db
    restart: unless-stopped
    # Windows'dan Linux'a hot-reload'un sorunsuz çalışması için polling eklenebilir, ancak genelde direkt çalışır.

  frontend:
    build: ./frontend_react
    container_name: chatbot_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend_react:/app
      - /app/node_modules # Local node_modules ile çakışmayı önler
    environment:
      - CHOKIDAR_USEPOLLING=true # Windows'ta hot reload çalışması için
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
